<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Hail Mary - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="max-w-3xl mx-auto p-6">
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-2xl font-bold tracking-tight text-emerald-400">🚀 Project Hail Mary</h1>
            <span class="text-xs bg-emerald-950 text-emerald-300 px-3 py-1 rounded-full border border-emerald-800/50">Markdown Dashboard</span>
        </header>

        <section class="bg-gray-800/50 border border-gray-700/50 rounded-xl p-4 mb-8 shadow-lg">
            <h2 class="text-lg font-semibold mb-3 text-gray-200">New Note</h2>
            <form class="space-y-3">
                <input type="text" placeholder="Note Title..." class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
                <textarea rows="3" placeholder="Write markdown note..." class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500"></textarea>
                <button type="button" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">Save Note</button>
            </form>
        </section>

        <main class="space-y-4">
            <h2 class="text-lg font-semibold text-gray-200 mb-4">Notes Timeline</h2>
            
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 shadow">
                <div class="text-xs text-gray-500 mb-1">note-1.md</div>
                <div class="text-md font-semibold text-emerald-300">Welcome to Project Hail Mary</div>
                <pre class="text-sm text-gray-300 whitespace-pre-wrap font-sans bg-gray-950 p-3 rounded-lg border border-gray-800/50 mt-2">This is our first markdown note running locally!</pre>
            </div>
        </main>
    </div>
</body>
</html>
